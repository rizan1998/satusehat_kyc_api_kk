version: "3"

networks:
  himed_network:
    external: true

services:
  satusehat_kyc_api_kk:
    container_name: satusehat_kyc_api_kk
    image: rizan1998/satusehat_kyc_api_kk
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9500:80"
    volumes:
      - ./medisy-satusehat-master:/var/www
      - ./medisy-satusehat-master/public:/var/www/html
      - ./.env:/var/www/.env
      - ./medisy-satusehat-master/storage:/var/www/storage
    environment:
      - app_name=Satu sehat API
    # TAMBAHKAN KONFIGURASI DNS INI:
    dns:
      - 8.8.8.8       # Google DNS Primary
      - 8.8.4.4       # Google DNS Secondary  
      - 1.1.1.1       # Cloudflare DNS
    dns_search:
      - .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - himed_network

  satusehat_kyc_api_kk_queue:
    container_name: satusehat_kyc_api_kk_queue
    image: rizan1998/satusehat_kyc_api_kk
    restart: unless-stopped
    command: >
      bash -c "
      php artisan queue:work --queue=sync --tries=3 --timeout=60 &
      php artisan schedule:work &
      wait"  # Menunggu kedua proses berjalan
    volumes:
      - ./medisy-satusehat-master:/var/www
      - ./.env:/var/www/.env
    networks:
      - himed_network

